id = "temet.logs"
name = "logs"
version = "0.1.0"
min_ask_kit = "0.3.0"
says = "an app's or project's log files on disk (JSON lines or plain text, rotated or gzipped): which errors happen most and which are new, when an error first appeared and how often since, what happened around a time, a line or a request id, when a burst of errors started, what a web access log says (5xx by path, slowest paths), how two logs or two days differ; with tokens, emails and card numbers masked in what comes back"
keywords = ["log files?", "\\.log\\b", "\\.jsonl\\b", "\\.ndjson\\b", "app(lication)? logs?", "error logs?", "access logs?", "(in|from|of) the logs?", "rotated", "request ids?", "correlation ids?", "first (seen|appeared)", "when did (this|the|it) (error|warning) (first )?(start|appear|begin)", "new errors?", "most (common|frequent) errors?", "error rate", "5\\d\\d (errors?|responses?)", "502s?", "logs? (say|show|from)", "grep the logs?", "stack ?traces? in"]
route_hint = "the contents of a log file on disk (an app's or project's .log, .jsonl or rotated and gzipped files: which errors, which are new, when one first appeared, what happened around a time or a request id, an access log's 5xx) are logs; a service's journal on this machine's units (journalctl, why a unit restarted) is ops or systemd; a container's logs are docker; a CI run's log is github; the output of a test run is tests; what a past agent session said or ran is sessions or mike; the code that writes the log is code"
cite = "the log file and line number, the time, and the signature or request id that groups the entries"
instructions = "instructions.md"
scripts = "scripts"
bench = "bench/questions.json"

[[settings]]
key = "WORKDIR"
about = "the folder questions are about; relative log paths resolve against it. By default the folder the agent runs in"
detect = ["node", "-e", "process.stdout.write(process.cwd())"]

[[settings]]
key = "LOGS_DIRS"
about = "folders searched for logs when a question names none, separated by commas, absolute or relative to WORKDIR. Default: ./logs, ./log and /var/log"
default = ""

[[settings]]
key = "LOGS_UTC_OFFSET"
about = "the UTC offset of log lines that carry no zone, such as +02:00; default UTC"
default = ""

[[sources]]
kind = "module"
name = "logs"
module = "logs.mjs"
api = "api.d.ts"

[[actions]]
name = "errors"
title = "Which errors a log has, most frequent first"
script = "errors"
match = ['(?:which|what) errors? (?:happen|occur|show up|appear)s? (?:the )?most(?: often)? in (?<file>[^\s?]+\.(?:log|jsonl|ndjson)[^\s?]*)', '(?:which|what) (?:are )?(?:the )?(?:most (?:common|frequent) errors?|errors? (?:are )?(?:most )?(?:common|frequent)) in (?<file>[^\s?]+\.(?:log|jsonl|ndjson)[^\s?]*)']
expect = '"verdict"'

[[actions]]
name = "overview"
title = "What log files there are"
script = "overview"
match = ['(?:what|which) log files? (?:are|exist|do (?:we|i) have)(?: there)?(?: in (?<dir>[^\s?]+))?']
expect = '"verdict"'
